name: CI
on:
  pull_request:              # every PR
  push:
    branches: [main]         # and every commit to main

permissions:
  contents: read             # least privilege: read-only access to the repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                    # reuses downloaded packages between runs
      - run: pip install -r requirements.txt
      - run: pytest -v
      
