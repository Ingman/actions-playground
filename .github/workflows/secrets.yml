name: Secrets
on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GREETING: hi                      # a variable defined right here
    steps:
      - name: Show env, variable and secret
        run: |
          echo "Greeting: $GREETING"
          echo "Color: ${{ vars.FAVORITE_COLOR }}"
          echo "Secret: ${{ secrets.MY_SECRET }}"

      - name: Use the secret without printing it
        env:
          PASSWORD: ${{ secrets.MY_SECRET }}
        run: |
          if [ "$PASSWORD" = "banana123" ]; then
            echo "Password is correct"
          else
            echo "Password is wrong"
          fi

      - name: Only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This runs because we're on main"

      - name: Only on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "This runs because we're NOT on main"
        
